<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
  <div class="container">
    <a class="navbar-brand fw-semibold" routerLink="/">Bokhandel</a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNavbar"
      aria-controls="mainNavbar"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/books" routerLinkActive="active">Böcker</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/quotes" routerLinkActive="active">Mina citat</a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-2 navbar-mobile-menu">
        <button
          class="btn btn-outline-secondary btn-sm"
          type="button"
          (click)="toggleTheme()"
          [attr.aria-label]="'Byt till ' + (theme === 'dark' ? 'ljust' : 'mörkt') + ' läge'"
        >
          <i class="fa-solid" [ngClass]="theme === 'dark' ? 'fa-sun' : 'fa-moon'"></i>
        </button>
        <ng-container *ngIf="isLoggedIn; else loggedOut">
          <span class="small text-muted d-inline-flex align-items-center gap-2">
            <i class="fa-solid fa-user text-secondary"></i>
            {{ username }}
          </span>
          <a class="btn btn-outline-secondary btn-sm" routerLink="/login" (click)="logout()">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logga ut
          </a>
        </ng-container>
        <ng-template #loggedOut>
          <a class="btn btn-outline-primary btn-sm" routerLink="/login">Logga in</a>
          <a class="btn btn-primary btn-sm" routerLink="/register">Registrera</a>
        </ng-template>
      </div>
    </div>
  </div>
</nav>
