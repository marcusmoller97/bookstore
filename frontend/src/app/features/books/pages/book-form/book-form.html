<div class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div>
      <h1 class="h4 mb-1">{{ isEdit ? 'Redigera bok' : 'Ny bok' }}</h1>
      <p class="text-muted mb-0">
        {{ isEdit ? 'Uppdatera information om boken.' : 'Lägg till en ny bok i listan.' }}
      </p>
    </div>
    <a class="btn btn-outline-secondary" routerLink="/books">Tillbaka</a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label" for="title">Titel</label>
          <input id="title" type="text" class="form-control" formControlName="title" />
          <div class="form-text text-danger" *ngIf="form.controls.title.touched && form.controls.title.invalid">
            Titel måste vara minst 2 tecken.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="author">Författare</label>
          <input id="author" type="text" class="form-control" formControlName="author" />
          <div class="form-text text-danger" *ngIf="form.controls.author.touched && form.controls.author.invalid">
            Författare måste vara minst 2 tecken.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="publishedDate">Publiceringsdatum</label>
          <input id="publishedDate" type="date" class="form-control" formControlName="publishedDate" />
        </div>

        <div class="alert alert-danger py-2" role="alert" *ngIf="error">
          {{ error }}
        </div>

        <button class="btn btn-primary" type="submit" [disabled]="form.invalid">
          {{ isEdit ? 'Spara ändringar' : 'Spara bok' }}
        </button>
      </form>
    </div>
  </div>
</div>
