<div class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div>
      <h1 class="h4 mb-1">Böcker</h1>
      <p class="text-muted mb-0">Hantera din boklista.</p>
    </div>
    <a class="btn btn-primary" routerLink="/books/new">Lägg till ny bok</a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div class="alert alert-danger m-3" role="alert" *ngIf="error">
        {{ error }}
      </div>
      <div class="table-responsive">
        <table class="table table-striped align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Titel</th>
              <th>Författare</th>
              <th>Publiceringsdatum</th>
              <th class="text-end">Åtgärder</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let book of books">
              <td>{{ book.title }}</td>
              <td>{{ book.author }}</td>
              <td>{{ book.publishedDate }}</td>
              <td class="text-end">
                <a class="btn btn-outline-warning btn-sm me-2" [routerLink]="['/books', book.id, 'edit']">
                  <i class="fa-solid fa-pen"></i>
                </a>
                <button class="btn btn-outline-danger btn-sm" type="button" (click)="deleteBook(book.id)">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </td>
            </tr>
            <tr *ngIf="books.length === 0">
              <td colspan="4" class="text-center text-muted py-4">Inga böcker än.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
