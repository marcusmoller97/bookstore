<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-3">Skapa konto</h1>
          <p class="text-muted mb-4">Registrera ett demo-konto för nu.</p>

          <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="mb-3">
              <label class="form-label" for="username">Användarnamn</label>
              <input
                id="username"
                type="text"
                class="form-control"
                placeholder="t.ex. nyanvändare"
                formControlName="username"
                autocomplete="username"
              />
              <div class="form-text text-danger" *ngIf="form.controls.username.touched && form.controls.username.invalid">
                Minst 3 tecken.
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="password">Lösenord</label>
              <input
                id="password"
                type="password"
                class="form-control"
                placeholder="Minst 6 tecken"
                formControlName="password"
                autocomplete="new-password"
              />
              <div class="form-text text-danger" *ngIf="form.controls.password.touched && form.controls.password.invalid">
                Minst 6 tecken.
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="confirmPassword">Bekräfta lösenord</label>
              <input
                id="confirmPassword"
                type="password"
                class="form-control"
                placeholder="Skriv samma lösenord igen"
                formControlName="confirmPassword"
                autocomplete="new-password"
              />
              <div class="form-text text-danger" *ngIf="form.controls.confirmPassword.touched && form.controls.confirmPassword.invalid">
                Minst 6 tecken.
              </div>
            </div>

            <div class="alert alert-danger py-2" role="alert" *ngIf="error">
              {{ error }}
            </div>
            <div class="alert alert-success py-2" role="alert" *ngIf="success">
              {{ success }}
            </div>

            <button class="btn btn-primary w-100" type="submit" [disabled]="form.invalid">
              Registrera
            </button>
          </form>

          <hr class="my-4" />

          <div class="small text-muted">
            Har du redan konto?
            <a routerLink="/login">Logga in</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<p>register works!</p>
