<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-3">Logga in</h1>
          <p class="text-muted mb-4">Logga in med ditt konto.</p>

          <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="mb-3">
              <label class="form-label" for="username">Användarnamn</label>
              <input
                id="username"
                type="text"
                class="form-control"
                placeholder="t.ex. admin"
                formControlName="username"
                autocomplete="username"
              />
              <div class="form-text text-danger" *ngIf="form.controls.username.touched && form.controls.username.invalid">
                Minst 3 tecken.
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="password">Lösenord</label>
              <input
                id="password"
                type="password"
                class="form-control"
                placeholder="t.ex. admin123"
                formControlName="password"
                autocomplete="current-password"
              />
              <div class="form-text text-danger" *ngIf="form.controls.password.touched && form.controls.password.invalid">
                Minst 4 tecken.
              </div>
            </div>

            <div class="alert alert-danger py-2" role="alert" *ngIf="error">
              {{ error }}
            </div>

            <div class="d-grid gap-2">
              <button class="btn btn-primary w-100" type="submit" [disabled]="form.invalid">
                Logga in
              </button>
              <a class="btn btn-outline-secondary w-100" routerLink="/register">
                Skapa konto
              </a>
            </div>
          </form>

          <hr class="my-4" />

          <div class="small">Har du inget konto?
            <a routerLink="/register">Registrera dig</a>
          </div>

          <div class="small text-muted">
            Har du inget konto? Registrera dig ovan.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
