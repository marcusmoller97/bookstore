<div class="modal fade" [class.show]="open" [style.display]="open ? 'block' : 'none'">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ title }}</h5>
        <button type="button" class="btn-close" (click)="cancel()"></button>
      </div>
      <div class="modal-body">
        {{ message }}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Avbryt</button>
        <button type="button" class="btn btn-danger" (click)="confirm()">Radera</button>
      </div>
    </div>
  </div>
</div>
